# SPDX-License-Identifier: AGPL-3.0-or-later
appId: com.smartinventure.impressive-ocr
productName: Impressive OCR
copyright: Copyright © 2026 Impressive OCR contributors. AGPL-3.0-or-later.

directories:
  output: ../../dist/release
  buildResources: build

files:
  - dist/**/*
  - package.json
  # Everything else is bundled into dist/main.cjs by esbuild, so the workspace source tree
  # does not need to ship.
  - '!src/**'
  - '!build.mjs'

extraResources:
  # The built SPA, served by the in-process backend over HTTP — the same page the headless
  # server serves, so there is only ever one frontend to test.
  - from: ../web/dist
    to: web
  # `uv` installs Python and PaddleOCR on first run. Outside the asar because an executable
  # inside an asar archive cannot be spawned.
  # ${arch} is expanded per build, which is what lets one macOS run produce an arm64 and an
  # x64 app that each carry the right binary. Lands at `uv/` inside the app either way.
  - from: ../../vendor/uv-${arch}
    to: uv
  - from: build/icons
    to: icons
  # Drizzle migrations are read from disk at startup, so they cannot be bundled into main.cjs.
  - from: ../../packages/db/migrations
    to: migrations
  # Installed into the user's venv at setup time, so the Python source has to be present.
  - from: ../../sidecar
    to: sidecar
    filter:
      - '**/*'
      - '!.venv/**'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
      - '!.pytest_cache/**'
      - '!.ruff_cache/**'
      - '!.mypy_cache/**'

# better-sqlite3 is a native addon and must be rebuilt against Electron's ABI, not Node's.
npmRebuild: true
asar: true
asarUnpack:
  - '**/*.node'

# Versioned names, which is what electron-updater writes into latest.yml. The stable aliases
# the website links to are added afterwards by deploy/make-stable-aliases.mjs, which simply
# removes the version segment — so the two names must differ by nothing else.
#
# Spelled out rather than ${productName}, because that contains a space and this string
# becomes a download URL. "Impressive%20OCR-1.0.0-win-x64.exe" is a link nobody wants to put
# on a website or paste into a terminal.
artifactName: Impressive-OCR-${version}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: smartinventure
  repo: impressive-ocr
  releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  # A real .ico, not the PNG. Windows wants the authored multi-size icon (16 through 256), and
  # NSIS in particular refuses anything else outright: handed a PNG, makensis fails with
  # "invalid icon file" while building the uninstaller, long after the app itself has packaged
  # fine. The mac and linux entries below stay PNG-based, which is what those targets want.
  icon: build/icons/icon.ico
  # Code signing is deliberately absent here.
  #
  # Azure Trusted Signing is injected by the release workflow as `-c.win.azureSignOptions.*`
  # (electron-builder deep-merges CLI config over this file). Declaring it statically would
  # make every local `pnpm package` and every fork's build attempt to reach an Azure endpoint
  # it has no credentials for, and fail — instead of quietly producing an unsigned build,
  # which is exactly what a developer wants.
  # ARM64 is deliberately absent: PaddlePaddle publishes no win-arm64 wheels, so a native
  # build would install and then fail at the runtime bootstrap. Windows on ARM runs the x64
  # build under Prism emulation instead, which is slower but correct.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Impressive OCR
  installerIcon: build/icons/icon.ico
  uninstallerIcon: build/icons/icon.ico
  license: ../../LICENSE
  # Leaves the user's pipelines, database and downloaded models in place on uninstall unless
  # they ask otherwise — silently deleting gigabytes of models and a job history would be a
  # nasty surprise on a routine reinstall.
  deleteAppDataOnUninstall: false
  include: build/installer.nsh

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is not a second download for users — it is what electron-updater installs from.
    # Its macOS updater cannot read a .dmg, so a release with only the dmg builds cleanly,
    # publishes cleanly, and then silently never updates anyone.
    - target: zip
      arch: [arm64, x64]
  icon: build/icons/icon.png
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # No camera, microphone or contacts access is ever requested; the app only reads the
    # folders the user has authorised.
    NSDocumentsFolderUsageDescription: Impressive OCR reads documents from the folders you authorise.
    NSDownloadsFolderUsageDescription: Impressive OCR reads documents from the folders you authorise.

dmg:
  title: ${productName} ${version}

linux:
  # Spelled out, because the default is derived from the package name and this package is
  # scoped: "@impressive-ocr/desktop" becomes "@impressive-ocrdesktop", and AppImage refuses
  # an executable name containing "@". The Windows and macOS targets never look at it, which
  # is why this only ever broke the Linux build.
  executableName: impressive-ocr
  # Ties the installed .desktop entry to Electron's app_id, so a running window is matched
  # to its launcher rather than showing up as a second, nameless application in the dock.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons
  category: Office
  synopsis: Local-first OCR workstation
  description: >-
    Watches folders, runs OCR on documents that land there with PaddleOCR, and writes the
    results as Markdown, JSON, TXT, DOCX, XLSX or a searchable PDF. Runs entirely on your own
    machine.

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
