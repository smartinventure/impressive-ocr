# SPDX-License-Identifier: AGPL-3.0-or-later
name: Verify code signing

# Manual only. This exists so the signing setup can be proved before a release depends on it.
#
# The release workflow deliberately treats missing credentials as "build unsigned and warn",
# so that forks and pull requests still work. The cost of that choice is that a
# misconfiguration there does not fail — it publishes an unsigned installer under the
# permanent `latest` links. This job inverts the rule: signing is the only thing it does, so
# anything short of a valid signature is an error.
#
# Nothing is tagged, released or pushed. The installer is kept as a short-lived artifact so it
# can be inspected by hand.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which signing setup to prove
        type: choice
        default: both
        options: [both, windows, macos]

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  sign-windows:
    name: Build and sign a Windows installer
    if: inputs.platform != 'macos'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: The credentials must be present
        # Checked first, before twenty minutes of building. An empty value here is the most
        # common setup mistake: saved on the Variables tab instead of Secrets, saved as an
        # environment secret, or the name misspelt. All three look identical from in here.
        shell: bash
        run: |
          set -eu
          missing=""
          [ -n "${AZURE_TENANT_ID:-}" ]     || missing="$missing AZURE_TENANT_ID(secret)"
          [ -n "${AZURE_CLIENT_ID:-}" ]     || missing="$missing AZURE_CLIENT_ID(secret)"
          [ -n "${AZURE_CLIENT_SECRET:-}" ] || missing="$missing AZURE_CLIENT_SECRET(secret)"
          [ -n "${{ vars.AZURE_SIGNING_ENDPOINT }}" ]     || missing="$missing AZURE_SIGNING_ENDPOINT(variable)"
          [ -n "${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}" ] || missing="$missing AZURE_CODE_SIGNING_ACCOUNT(variable)"
          [ -n "${{ vars.AZURE_CERT_PROFILE }}" ]         || missing="$missing AZURE_CERT_PROFILE(variable)"
          [ -n "${{ vars.AZURE_PUBLISHER_NAME }}" ]       || missing="$missing AZURE_PUBLISHER_NAME(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Not configured:$missing"
            exit 1
          fi
          echo "endpoint : ${{ vars.AZURE_SIGNING_ENDPOINT }}"
          echo "account  : ${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}"
          echo "profile  : ${{ vars.AZURE_CERT_PROFILE }}"
          echo "publisher: ${{ vars.AZURE_PUBLISHER_NAME }}"

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the web UI
        run: pnpm --filter @impressive-ocr/web build

      - name: Fetch the bundled uv binary
        run: node deploy/fetch-uv.mjs --target win --arch x64

      - name: Package and sign
        # Identical to the release workflow's signed path, so a pass here means that path
        # works too.
        shell: bash
        run: |
          pnpm --filter @impressive-ocr/desktop package --win \
            -c.win.azureSignOptions.endpoint="${{ vars.AZURE_SIGNING_ENDPOINT }}" \
            -c.win.azureSignOptions.codeSigningAccountName="${{ vars.AZURE_CODE_SIGNING_ACCOUNT }}" \
            -c.win.azureSignOptions.certificateProfileName="${{ vars.AZURE_CERT_PROFILE }}" \
            -c.win.azureSignOptions.publisherName="${{ vars.AZURE_PUBLISHER_NAME }}"

      - name: The installer must carry a valid, timestamped signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Get-ChildItem dist/release -Filter *.exe -Recurse |
            Where-Object { $_.Name -notlike '*elevate*' } |
            Select-Object -First 1
          if (-not $exe) { throw 'No installer was produced.' }
          Write-Host "Checking $($exe.Name)"

          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Status : $($sig.Status)"
          Write-Host "Subject: $($sig.SignerCertificate.Subject)"

          if ($sig.Status -ne 'Valid') {
            throw "Signature status is '$($sig.Status)', expected 'Valid'."
          }

          # Trusted Signing certificates are deliberately short-lived - days, not years - and
          # rotate automatically. Only the RFC 3161 timestamp keeps an installer trusted past
          # that window, so an untimestamped signature is a release that expires almost
          # immediately. Worth failing on, because nothing else would notice.
          if (-not $sig.TimeStamperCertificate) {
            throw 'The signature carries no timestamp; it would stop validating within days.'
          }
          Write-Host "Timestamped by: $($sig.TimeStamperCertificate.Subject)"

          # The common name is compared rather than the whole DN: .NET and the Azure portal do
          # not always render the other components identically, and a false failure here would
          # be worse than the narrower check. electron-updater does the full comparison at
          # update time, which is where it actually matters.
          function Get-Cn([string]$dn) {
            if ($dn -match 'CN=([^,]+)') { return $Matches[1].Trim() }
            return $dn.Trim()
          }
          $signed   = Get-Cn $sig.SignerCertificate.Subject
          $expected = Get-Cn '${{ vars.AZURE_PUBLISHER_NAME }}'
          if ($signed -ne $expected) {
            throw "Signed as '$signed' but AZURE_PUBLISHER_NAME says '$expected'. Updates would be rejected on users' machines."
          }

          Write-Host "OK - signed as '$signed', timestamped, status Valid."

      - uses: actions/upload-artifact@v7
        with:
          name: signed-installer-for-inspection
          path: dist/release/*.exe
          if-no-files-found: error
          # Short: this is a test build, not something anyone should install from.
          retention-days: 3

  # -------------------------------------------------------------------------------------
  # macOS: Developer ID signing plus Apple notarisation.
  #
  # Two separate things, and the second is the one that catches people out. A signed but
  # un-notarised app runs perfectly on the machine that built it and is blocked by Gatekeeper
  # on every machine that downloads it, so the only honest test is `stapler validate` on a
  # freshly built app.
  # -------------------------------------------------------------------------------------
  sign-macos:
    name: Build, sign and notarise a macOS app
    if: inputs.platform != 'windows'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: The credentials must be present
        # First, before forty minutes of building. Saving a value on the Variables tab
        # instead of Secrets, or misspelling a name, looks identical from in here.
        run: |
          set -eu
          missing=""
          [ -n "${APPLE_CERT_BASE64:-}" ]   || missing="$missing APPLE_CERT_BASE64"
          [ -n "${APPLE_CERT_PASSWORD:-}" ] || missing="$missing APPLE_CERT_PASSWORD"
          [ -n "${APPLE_TEAM_ID:-}" ]       || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not configured (all are secrets):$missing"
            exit 1
          fi

          # Either notarisation credential set will do. The API key is preferred, but Apple
          # reviews API access case by case, so an Apple ID has to be usable meanwhile -
          # otherwise this job cannot prove a setup that the release workflow would accept.
          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ] || {
              echo '::error::APPLE_API_KEY_BASE64 is set but APPLE_API_KEY_ID/APPLE_API_ISSUER are not.'
              exit 1
            }
            echo "team: $APPLE_TEAM_ID   notarising with API key $APPLE_API_KEY_ID"
          elif [ -n "${APPLE_APP_PASSWORD:-}" ]; then
            [ -n "${APPLE_ID:-}" ] || {
              echo '::error::APPLE_APP_PASSWORD is set but APPLE_ID is not.'; exit 1; }
            echo "team: $APPLE_TEAM_ID   notarising with Apple ID $APPLE_ID"
          else
            echo '::error::No notarisation credentials. Set APPLE_API_KEY_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_ID + APPLE_APP_PASSWORD.'
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the web UI
        run: pnpm --filter @impressive-ocr/web build

      - name: Fetch the bundled uv binaries
        run: |
          node deploy/fetch-uv.mjs --target mac --arch arm64
          node deploy/fetch-uv.mjs --target mac --arch x64

      - name: Choose the Apple notarisation credentials
        # Exactly one set is put into scope, never both: electron-builder checks the
        # Apple-ID variables first and, if either is present, commits to that path and throws
        # when the rest is missing rather than falling back to the API key.
        run: |
          set -eu
          if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
            key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
            echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
            head -1 "$key_path" | grep -q 'BEGIN PRIVATE KEY' \
              || { echo '::error::APPLE_API_KEY_BASE64 did not decode to a .p8 private key.'; exit 1; }
            chmod 600 "$key_path"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          else
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_PASSWORD" >> "$GITHUB_ENV"
          fi


      - name: Import the signing certificate into a keychain
        
        # The keychain is built here rather than left to electron-builder, because its own
        # implementation cannot work on a current macOS runner. `createKeychain` makes the
        # keychain with a random password:
        #
        #     const keychainPassword = randomBytes(32).toString("base64")
        #
        # and then `importCerts` runs
        #
        #     security set-key-partition-list -S apple-tool:,apple: -s -k <cert password>
        #
        # passing the *certificate's* password where macOS expects the *keychain's*. That
        # fails with "SecKeychainUnlock: The user name or passphrase you entered is not
        # correct", which reads as a wrong certificate password and is nothing of the kind.
        #
        # macPackager only calls createKeychain when CSC_LINK is set; with it absent it uses
        # CSC_KEYCHAIN as given. So the certificate never goes through CSC_LINK, and the
        # partition list is set with the password that actually opens the keychain.
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        shell: bash
        run: |
          set -eu
          cert="${RUNNER_TEMP}/certificate.p12"
          echo "$APPLE_CERT_BASE64" | base64 --decode > "$cert"
          [ -s "$cert" ] \
            || { echo '::error::APPLE_CERT_BASE64 did not decode to anything.'; exit 1; }

          # Checked before the import, because `security` reports the one failure it cannot
          # diagnose as a password problem. macOS imports only a SHA-1 MAC; OpenSSL 3 - every
          # current Linux, WSL and Git for Windows install - writes SHA-256 by default.
          info=$(openssl pkcs12 -in "$cert" -info -noout -passin env:APPLE_CERT_PASSWORD 2>&1 || true)
          # A wrong password prints the MAC line too, so that branch is tested first.
          case "$info" in
            *"Mac verify error"*|*"invalid password"*)
              echo '::error::APPLE_CERT_PASSWORD does not open the .p12. A trailing newline in the secret is the usual cause.'
              exit 1 ;;
            *"MAC: sha1"*)
              echo 'Certificate OK - SHA-1 MAC, and the password opens it.' ;;
            *"MAC:"*)
              echo "::error::The .p12 uses $(printf '%s' "$info" | sed -n 's/.*\(MAC: [a-z0-9]*\).*/\1/p'), but macOS only imports a SHA-1 MAC. Re-export it with: openssl pkcs12 -export -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 ..."
              exit 1 ;;
            *)
              echo '::warning::Could not determine the .p12 MAC algorithm; continuing.' ;;
          esac

          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_pw=$(openssl rand -base64 24)

          security create-keychain -p "$keychain_pw" "$keychain"
          # -lut without -l: no lock on sleep, and a timeout long enough to outlive
          # notarisation, which can take the better part of an hour. A keychain that locks
          # mid-build fails at codesign with an error about the identity, not the lock.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"

          security import "$cert" -k "$keychain" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild

          # The step electron-builder gets wrong, with the password that actually opens the
          # keychain. Without it codesign prompts for authorisation and hangs on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_pw" "$keychain" >/dev/null

          # Appended to the search list rather than replacing it: codesign only looks at
          # keychains on the list, and dropping the login keychain breaks other tooling.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | sed -e 's/^ *//' -e 's/"//g')

          rm -f "$cert"

          # Fail here if the identity is not usable, rather than letting electron-builder
          # find no identity and quietly produce an unsigned build.
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | grep 'Developer ID Application:' || true)
          [ -n "$identity" ] || {
            echo '::error::No "Developer ID Application" identity in the keychain after import.'
            security find-identity -v "$keychain" || true
            exit 1
          }
          echo "Signing identity: $(printf '%s' "$identity" | sed 's/^ *[0-9]*) *[0-9A-F]* *//')"

          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package, sign and notarise
        # Identical to the release workflow's signed path, so a pass here means that path
        # works too.
        #
        # No CSC_LINK: setting it makes electron-builder build its own keychain rather than
        # using CSC_KEYCHAIN from the step above. APPLE_ID is blanked unless the Apple-ID
        # route was chosen, because electron-builder treats its mere presence as "use the
        # Apple-ID path" and would then throw over a password meant never to be used.
        env:
          APPLE_ID: ${{ env.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_ID || '' }}
        run: pnpm --filter @impressive-ocr/desktop package --mac

      - name: The app must be signed by Developer ID, hardened and stapled
        run: |
          set -eu
          shopt -s nullglob
          apps=(dist/release/mac*/*.app)
          [ ${#apps[@]} -gt 0 ] || { echo '::error::No .app was produced.'; exit 1; }

          for app in "${apps[@]}"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"

            authority=$(codesign --display --verbose=2 "$app" 2>&1 \
              | sed -n 's/^Authority=//p' | head -1)
            echo "signed by: $authority"
            case "$authority" in
              "Developer ID Application:"*) ;;
              *) echo "::error::Signed by '$authority', expected a Developer ID Application certificate."; exit 1 ;;
            esac

            # A notarisation prerequisite. Apple rejects an unhardened app, and the flag is
            # the usual reason an otherwise correct setup fails.
            codesign --display --verbose=2 "$app" 2>&1 | grep -q 'flags=.*runtime' \
              || { echo "::error::$app is not hardened."; exit 1; }

            # The only local proof that Apple notarised it, rather than electron-builder
            # having quietly skipped the step.
            xcrun stapler validate "$app"

            # What Gatekeeper will say on a user's machine.
            spctl --assess --type exec --verbose=2 "$app"
          done

          for dmg in dist/release/*.dmg; do
            echo "== $dmg"
            codesign --verify --verbose=2 "$dmg"
          done

          echo 'OK - Developer ID signed, hardened, notarised and stapled.'

      - uses: actions/upload-artifact@v7
        with:
          name: signed-macos-for-inspection
          path: dist/release/*.dmg
          if-no-files-found: error
          retention-days: 3
