name: CI

# Deliberately NOT on push.
#
# Every push to main used to run four jobs across two operating systems. On a public
# repository that is free, but it is not free if this ever goes private, and a wedged job
# bills against the default six-hour ceiling either way.
#
# What replaces it: `deploy/release.ps1` and `release.sh` run lint, typecheck and the full
# test suite locally and refuse to tag if any of them fails, and `release.yml` runs the same
# suite again on a clean runner before it builds anything. So the checks that matter still
# stand between a mistake and a release - they just no longer run on every commit.
#
# Run it by hand from the Actions tab whenever a change deserves the full matrix before a
# release, and on any pull request automatically.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push supersedes the previous run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  node:
    name: Node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately: nearly every bug found while building this was
        # platform-specific — path separators, drive-letter roots, case-insensitive
        # comparisons. Linux alone would have missed them.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check no source is excluded by .gitignore
        # An unanchored pattern silently kept three real directories out of the repository,
        # and nothing noticed until someone cloned it elsewhere. A clean `git status` cannot
        # catch that, because an ignored file is invisible rather than untracked.
        run: pnpm check:sources

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Build the web UI
        run: pnpm --filter @impressive-ocr/web build

      - name: Package the headless server
        # The release workflow is the only other place this runs, and there it runs for the
        # first time on a tag — where a broken packaging script means a failed release rather
        # than a failed pull request. `uv` is fetched because the payload embeds it.
        if: matrix.os == 'ubuntu-latest'
        run: |
          node deploy/fetch-uv.mjs --target server --arch x64
          node deploy/package-server.mjs --arch x64

      - name: The packaged server must actually start
        # Packaging can succeed while producing something that cannot run: a missing
        # migration directory, an unresolvable native module, a launcher pointing at the
        # wrong path. None of that shows up until someone unpacks it.
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -eu
          mkdir -p /tmp/smoke && tar -xzf dist/release/*.tar.gz -C /tmp/smoke
          root="$(find /tmp/smoke -maxdepth 1 -mindepth 1 -type d)"

          IMPRESSIVE_OCR_DATA_DIR=/tmp/smoke-data "$root/bin/impressive-ocr-server" &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8084/api/health > /tmp/health.json; then
              echo "Health: $(cat /tmp/health.json)"
              curl -fsS -o /dev/null http://127.0.0.1:8084/
              echo "The SPA is served."
              exit 0
            fi
            sleep 2
          done

          echo "::error::The packaged server never became healthy."
          exit 1

  sidecar:
    name: Python sidecar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the sidecar
        working-directory: sidecar
        # PaddleOCR itself is deliberately absent — it is installed at runtime by the app's
        # bootstrap. Everything tested here runs without it, which is the point: the
        # sidecar's own logic must be verifiable without a multi-gigabyte dependency.
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: sidecar
        run: ruff check .

      - name: Typecheck
        working-directory: sidecar
        run: mypy src

      - name: Test
        working-directory: sidecar
        run: pytest -q

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        # Not pushed and not tagged for release - this only has to prove the Dockerfile still
        # builds. Pushing happens in release.yml, on a tag.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Electron app packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the web UI
        run: pnpm --filter @impressive-ocr/web build

      - name: Fetch the bundled uv binary
        run: node deploy/fetch-uv.mjs --target linux --arch x64

      - name: Package the real Linux targets
        # `--linux`, not `--dir`. The unpacked build skips every installer, and installers are
        # where the packaging bugs have actually been: NSIS rejecting a PNG icon on Windows,
        # AppImage rejecting an executable name derived from a scoped package name on Linux.
        # Both passed `--dir` and both broke a release.
        #
        # Only Linux is built here - it is the platform this runner is, and building the other
        # two would mean paying for a Windows and a macOS runner on every pull request.
        run: pnpm --filter @impressive-ocr/desktop package --linux

      - name: The app must contain everything it needs at runtime
        # Packaging succeeds happily with an extraResources entry pointing at nothing, and the
        # result is an app that installs and then fails on first launch looking for its SPA or
        # its migrations. Each of these is a path in electron-builder.yml that a refactor can
        # silently invalidate - vendor/uv-<arch> already moved once.
        run: |
          set -eu
          root="$(find dist/release -maxdepth 1 -name '*-unpacked' -type d | head -1)"
          [ -n "$root" ] || { echo "::error::No unpacked app was produced."; exit 1; }
          echo "Checking $root"

          missing=""
          for item in             resources/web/index.html             resources/migrations             resources/sidecar/pyproject.toml             resources/app.asar
          do
            if [ -e "$root/$item" ]; then
              echo "  ok      $item"
            else
              echo "  MISSING $item"
              missing="$missing $item"
            fi
          done

          # Named explicitly rather than as `resources/uv/uv`, because Git Bash resolves a
          # bare name to its .exe and would report a file that is not there. Only Linux runs
          # this job today, but a silent pass is the wrong thing to leave lying around.
          if [ -e "$root/resources/uv/uv" ] || [ -e "$root/resources/uv/uv.exe" ]; then
            echo "  ok      resources/uv/uv[.exe]"
          else
            echo "  MISSING resources/uv/uv[.exe]"
            missing="$missing resources/uv/uv"
          fi

          if [ -n "$missing" ]; then
            echo "::error::The packaged app is missing:$missing"
            exit 1
          fi

          # And the installers themselves exist. Packaging can report success having produced
          # only the unpacked directory.
          for pattern in 'dist/release/*.AppImage' 'dist/release/*.deb'; do
            # shellcheck disable=SC2086
            if ls $pattern >/dev/null 2>&1; then
              echo "  ok      $pattern"
            else
              echo "::error::No file matched $pattern"
              exit 1
            fi
          done
